[project]
name = "ksp-cip"
version = "1.0.0"
description = "Karnataka State Police Crime Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "networkx>=3.2",
  "reportlab>=4.1",
  "jinja2>=3.1",
  # Runtime, not dev-only: the hosted LLM providers and the Bhashini language
  # adapter import httpx lazily. Leaving it a dev extra meant selecting
  # KSPCIP_LLM_PROVIDER=anthropic (or LANGUAGE_PROVIDER=bhashini) started
  # cleanly and then raised ModuleNotFoundError on the first real call, in a
  # deployment, with no startup warning. Every other outbound adapter
  # (Catalyst Data Store/Stratus/Cache, AI4Bharat) uses stdlib urllib.
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: seeds a full synthetic dataset",
  "deployment: talks to a real, explicitly-configured Catalyst project; skipped unless opted in",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["ksp_cip*"]
